name: Bug
description: Something is broken or wrong
labels: [bug, needs-triage]
body:
  - type: textarea
    id: symptom
    attributes:
      label: What happened
      description: The exact wrong output, error string, or screenshot. Name the surface it happened on.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: How to reproduce
      description: The specific input, record, or steps that trigger it.
