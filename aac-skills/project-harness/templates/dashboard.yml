name: Refresh dashboard

# DASHBOARD.md stays accurate at the end of every commit and every tracker change:
# every push to the default branch and every issue open or close regenerates it (a label edit
# needs a workflow_dispatch; the list was narrowed 2026-09-16 under the Actions-quota ruling).
#
# NO daily cron. Issue 21 on claude-dotfiles (2026-08-26): the relative "N days ago" labels in
# the dashboard drifted daily by construction, so the 6am safety tick regenerated the file every
# night purely to bump those labels, and each run produced a "chore: refresh dashboard" commit
# that changed nothing else. The fix pairs with `build-dashboard.js` switching to ISO calendar
# dates (fmtDate) — same input, same output — so a schedule tick has nothing to do and the cron
# is gone. Push and issue events still fire this workflow; the "Commit if changed" step below
# already guards against no-op commits (`git diff --quiet` after `git add -N`), so the workflow
# writes a commit only when something outside the dashboard's control actually moved.
#
# INSTALL-TIME SUBSTITUTION: "main" appears TWICE below (push.branches and checkout.ref).
# Replace both with the repo's actual default branch (git symbolic-ref refs/remotes/origin/HEAD).
# On a master repo the un-substituted workflow never fires on push and the checkout pins the
# wrong ref -- and the failure is SILENT: no run, no error. (Hit on aac-task-management,
# 2026-07-28: default branch master.)
on:
  push:
    branches: [main]
  # TWO issue types only. The 2026-09-16 Actions-quota ruling (claude-dotfiles issue 117,
  # `docs/tickets/117-decision.md`): the eight-type list ran `Refresh dashboard` at 179.2 runs/day
  # across six repos, 3.09x the 58 runs/day baseline, because `edited`, `labeled`, `unlabeled`,
  # `assigned` and `unassigned` fire on every triage touch while changing little the dashboard
  # shows. Do not restore the long list by reflex; a label-driven refresh is one
  # `workflow_dispatch` away.
  issues:
    types: [opened, closed]
  workflow_dispatch:

concurrency:
  group: dashboard
  cancel-in-progress: true

permissions:
  contents: write
  issues: read
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # INSTALL-TIME: if CONFIG.testCommand is not Node, the runner has no test
      # environment -- add the language setup AND the dependency install here, or
      # the dashboard's health line reads "FAILING -- 1 error" (a collection/import
      # error, not a real failure) while the suite is green locally. Install the
      # FULL dependency set the test suite imports, optional extras included: on
      # aac-task-management (2026-07-28) `.[dev]` alone failed collection because
      # one test imports a script whose module top imports an extra's package.
      # Python example:
      #   - uses: actions/setup-python@v5
      #     with: { python-version: '3.12' }
      #   - run: pip install -e ".[dev,<extras-the-tests-import>]"
      - name: Build DASHBOARD.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-dashboard.js
      - name: Commit if changed
        run: |
          # `git add -N` (intent-to-add) FIRST. `git diff` is blind to an untracked file, so on a
          # repo where DASHBOARD.md does not exist yet -- i.e. every fresh install -- this step
          # printed "Dashboard unchanged" and exited 0. The workflow went green while never
          # creating the artifact it exists to create, and nothing about the run looked wrong.
          # Found on the commissions install, 2026-07-30 (run 30570115511). Do not remove.
          git add -N DASHBOARD.md
          if git diff --quiet -- DASHBOARD.md; then
            echo "Dashboard unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DASHBOARD.md
          git commit -m "chore: refresh dashboard [skip ci]"
          # Push the fresh commit to a dedicated `dashboard` branch, NOT the default branch.
          # claude-dotfiles issue 20 (2026-08-26): committing DASHBOARD.md refreshes back to
          # master advanced origin on a file that was not part of the sync manifest, which
          # flipped already-drifted live copies into state3 (both-diverged hard block) on
          # every issue event and every push. The fix is a branch-split: master is never
          # advanced by CI; DASHBOARD.md lands on a snapshot branch that is force-pushed
          # each run (a snapshot rebased on the default branch's tip, not a rolling history).
          # Stable read URL:
          #   https://github.com/<owner>/<repo>/blob/dashboard/DASHBOARD.md
          # Ported to the harness template by claude-dotfiles issue 27.
          git push -f origin HEAD:refs/heads/dashboard
