name: Skill stamps

# Every SKILL.md carries modified / previous-modified / revision / content-sha under metadata
# (tools/skill-stamps.py). This job fails a branch where:
#   - a skill under aac-skills/ - the repo's one skill tree since issue 214 - was edited without
#     a re-stamp (its content hash moved), or
#   - the plugin payload no longer builds from the branch's sources (a digest over its cap, a
#     reworded rules section the digest marks depend on), or
#   - a pull request edits the generated payload itself.
# It no longer compares the committed payload with a rebuild (issue 1308): a PR carries sources
# only, and .github/workflows/payload-rebuild.yml rebuilds marketplace/aac-skills and both version
# files on master after each merge. So a PR whose payload is behind master passes here. The unit
# tests read the payload, so they run against a build of this branch made in the runner - what
# master will ship after the merge - and never against the PR's committed copy.
# The fix for a stale stamp is one command, from the repo root (CLAUDE.md, "Skill stamps").
# --home names the owner's home, the one the tree is spelled against; the tool defaults to that
# same value (OWNER_HOME in tools/skill-stamps.py, never the container's own home, issues 431 and
# 492), and the flag is spelled out so the recipe and this job's check step read alike.
#   python3 tools/skill-stamps.py stamp aac-skills --home 'C:\Users\Dan'
# The dashboard branch is a force-pushed snapshot artifact and is never checked.

on:
  pull_request:
  push:
    branches-ignore: [dashboard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # a first-time stamp reads its dates from the git history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Stamps current on aac-skills
        run: python3 tools/skill-stamps.py check aac-skills --home 'C:\Users\Dan'
      - name: The payload builds from this branch's sources
        # Runs even after the stamp check failed: a branch that drifted in both should hear about
        # both, rather than come back for a second round. --no-stamp-write leaves the sources as
        # committed, so the check above stays the verdict on them. The build lands in this
        # runner's checkout only and nothing here commits it.
        if: ${{ !cancelled() }}
        run: python3 tools/build-cloud-plugin.py --home 'C:\Users\Dan' --no-stamp-write
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: |
          python3 tools/skill-stamps.test.py
          python3 tests/build-cloud-plugin.test.py
      - name: A pull request leaves the generated payload alone
        # Issue 1308: payload-rebuild.yml writes these on master. A PR that commits its own build
        # brings back the version-line conflict every other open PR then has to merge around.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          touched=$(git diff --name-only "$BASE...$HEAD" -- marketplace .claude-plugin/marketplace.json)
          if [ -n "$touched" ]; then
            echo "$touched"
            echo "::error::this PR edits the generated plugin payload. Drop those changes (git checkout origin/master -- marketplace .claude-plugin/marketplace.json); master rebuilds the payload after the merge"
            exit 1
          fi
