name: Skill stamps

# Every SKILL.md carries modified / previous-modified / revision / content-sha under metadata
# (tools/skill-stamps.py). This job fails a branch where a skill under aac-skills/ - the repo's
# one skill tree since issue 214 - was edited without a re-stamp (its content hash moved), or
# where the packager can no longer build the plugin from that tree.
#
# It no longer compares the committed payload with a rebuild (issue 1308). marketplace/aac-skills
# and the version in .claude-plugin/marketplace.json are built on master after each merge by
# plugin-payload.yml, which makes that comparison before it commits. A pull request carries
# sources only, so a payload behind master is expected here, not a failure.
# The fix for a stale stamp is one command, from the repo root (CLAUDE.md, "Skill stamps").
# --home names the owner's home, the one the tree is spelled against; the tool defaults to that
# same value (OWNER_HOME in tools/skill-stamps.py, never the container's own home, issues 431 and
# 492), and the flag is spelled out so the recipe and this job's check step read alike.
#   python3 tools/skill-stamps.py stamp aac-skills --home 'C:\Users\Dan'
# The dashboard branch is a force-pushed snapshot artifact and is never checked.

on:
  pull_request:
  push:
    branches-ignore: [dashboard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # a first-time stamp reads its dates from the git history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Unit tests
        run: |
          python3 tools/skill-stamps.test.py
          python3 tests/build-cloud-plugin.test.py
      - name: Stamps current on aac-skills
        run: python3 tools/skill-stamps.py check aac-skills --home 'C:\Users\Dan'
      - name: The plugin builds from aac-skills
        # Runs even after the stamp check failed: a branch that broke both should hear about both.
        # The build lands in a scratch directory and is never diffed against marketplace/: that
        # copy is master's to write (plugin-payload.yml, issue 1308), and the issue-432
        # byte-for-byte comparison runs there, before each commit.
        if: ${{ !cancelled() }}
        run: |
          python3 tools/build-cloud-plugin.py --home 'C:\Users\Dan' \
            --out /tmp/dist --no-marketplace --no-stamp-write
