name: Skill stamps

# Every SKILL.md carries modified / previous-modified / revision / content-sha under metadata
# (tools/skill-stamps.py). This job fails a branch where:
#   - a skill under aac-skills/ or under the agents/skills/ mirror was edited without a re-stamp
#     (its content hash moved) - one named step per tree, so the failure says which one, or
#   - the committed plugin payload no longer matches what the packager builds from the mirror,
#     i.e. someone changed a skill and did not republish the plugin. The whole of
#     marketplace/aac-skills is diffed, plugin.json's version included: that version follows the
#     payload, not the wall clock, so an unchanged mirror rebuilds byte for byte (issue 432).
#     .claude-plugin/marketplace.json repeats the version and is not rebuilt here (--no-marketplace).
# The fix for all of them is the same two commands, from the repo root (CLAUDE.md, "Skill stamps").
# --home on BOTH is what makes them reproduce this job: without it the stamper hashes against the
# container's own home and re-stamps skills nobody touched (issue 431).
#   python3 tools/skill-stamps.py stamp aac-skills agents/skills claude/skills --home 'C:\Users\Dan'
#   python3 tools/build-cloud-plugin.py --from-mirror --home 'C:\Users\Dan'
# The dashboard branch is a force-pushed snapshot artifact and is never checked.

on:
  pull_request:
  push:
    branches-ignore: [dashboard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # a first-time stamp reads its dates from the git history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Unit tests
        run: |
          python3 tools/skill-stamps.test.py
          python3 tests/build-cloud-plugin.test.py
      - name: Stamps current on aac-skills
        run: python3 tools/skill-stamps.py check aac-skills --home 'C:\Users\Dan'
      - name: Stamps current on agents/skills
        # Runs even after aac-skills failed: a branch that drifted in both trees should name both,
        # rather than send you back for a second round.
        if: ${{ !cancelled() }}
        run: python3 tools/skill-stamps.py check agents/skills --home 'C:\Users\Dan'
      - name: Plugin payload matches a rebuild from the mirror
        run: |
          python3 tools/build-cloud-plugin.py --from-mirror --home 'C:\Users\Dan' \
            --out /tmp/dist --no-marketplace --no-stamp-write
          # One diff over the whole tree: plugin.json's version (issue 432), the hook scripts
          # (issue 208) and the rules text the UserPromptSubmit hook injects (issue 209, a copy of
          # the owner's CLAUDE.md section, so a stale one delivers yesterday's rules every prompt)
          # are all checked by this line. Files a hook run drops into the payload at runtime
          # (hooks/scripts/__pycache__ from ask_matt_gate.py) are not payload: excluded here and
          # skipped by the packager's own fingerprint, one rule for both (issue 484).
          if ! diff -r --exclude=__pycache__ --exclude=.pytest_cache /tmp/dist/aac-skills marketplace/aac-skills; then
            echo "::error::marketplace/aac-skills is stale - rebuild it with tools/build-cloud-plugin.py --from-mirror --home 'C:\Users\Dan'"
            exit 1
          fi
