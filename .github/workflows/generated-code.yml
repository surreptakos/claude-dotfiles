name: Generated code

# Issue 487. Two artifacts here are written by a generator, from a source file that lives beside
# it, and until this job existed nothing invoked either generator:
#   tools/build-fleet-inline.js            <- tools/ticket-fleet-branch.js
#     -> the [FLEET-GENERATED] region of aac-skills/ticket-fleet/ticket-fleet.js (issue 440)
#   tools/build-harness-tracker-audit.js   <- tools/tracker-audit.js
#     -> aac-skills/project-harness/templates/tracker-audit.js (issue 336)
# So the ordinary sequence - edit the source, commit, forget the generator - put a stale artifact
# on master and surfaced only in the next unrelated test run. This job is the whole gate: the
# commit-time half ran the same two --check calls from `.githooks/pre-commit` until that hook
# retired with the freshness loop (issue 213), and it never covered a cloud session's container
# or a commit made with --no-verify anyway.
#
# The fix for either failure is the command the generator itself prints: run it without --check,
# which rewrites the artifact, then commit the result.
# The dashboard branch is a force-pushed snapshot artifact and is never checked.
#
# Issue 933 adds a third check: a change under aac-skills/project-harness/templates/ must bump
# `harness-version: N` in templates/harness-version.md. PR 914 changed templates/tracker-audit.js
# at v33, so no install read as behind and no sweep ran. The fix is the version bump plus the
# project-harness skill's step-7 sweep. It diffs against the merge-base with origin/master (or,
# on a push to master, the previous tip), hence the full-history checkout.

on:
  pull_request:
  push:
    branches-ignore: [dashboard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fleet script block matches tools/ticket-fleet-branch.js
        run: node tools/build-fleet-inline.js --check
      - name: project-harness template matches tools/tracker-audit.js
        # Runs even after the fleet check failed: a branch that moved both sources should name
        # both, rather than send you back for a second round.
        if: ${{ !cancelled() }}
        run: node tools/build-harness-tracker-audit.js --check
      - name: aac-design token copies match assets/aac-tokens.json
        # Issue 1091: DESIGN-SYSTEM.md's Tokens section, build_form.py's token block and
        # aac-tokens.css are written by tools/build-design-tokens.js from one source.
        if: ${{ !cancelled() }}
        run: node tools/build-design-tokens.js --check
      - name: A harness template change bumps the harness version
        if: ${{ !cancelled() }}
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/master ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node tools/check-harness-version-bump.js --base "$BEFORE"
          else
            node tools/check-harness-version-bump.js
          fi
