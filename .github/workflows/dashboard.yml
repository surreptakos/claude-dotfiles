name: Refresh dashboard

# DASHBOARD.md stays accurate at the end of every commit and every tracker change:
# every push to the default branch and every issue event regenerate it.
#
# NO SCHEDULE BLOCK (issue 21): DASHBOARD.md is drift-free -- its content depends only on the repo
# state, tracker state and the latest completed windows-restore-test.yml run on master, not on
# wall-clock time (see `ymd()` in scripts/build-dashboard.js, which
# renders timestamps as YYYY-MM-DD from the source ISO rather than "N days ago" relative to now).
# The daily 6am safety cron was there to catch label edits made outside events we listen to, but
# the `issues.types: [labeled, unlabeled]` triggers below already cover that, and every extra
# cron-driven refresh either committed an identical artifact (waste) or advanced master past state
# stamps held by live copies (state3 lockups). Adding a cron back is a regression -- fix the
# missing event trigger instead.
#
# THE COST QUESTION (issue 452, ruled by Dan 2026-09-18). This workflow was the account's largest
# Actions consumer: 1381 runs 2026-09-09..09-16 (176/day), ~3370 billable minutes a week, because
# it ran on windows-latest (2x billing) to execute the Windows restore suite on every event
# (docs/tickets/117-decision.md). The ruling answered the cost with the runner, not the triggers:
# every trigger below stays, [labeled, unlabeled] included -- trimming them would reopen the gap
# issue 21 closed when it removed the cron, and the answer to that gap is still an event, not a
# clock. What changed is what each run does: it moved to ubuntu and no longer runs the suite.
#
# INSTALL-TIME SUBSTITUTION: "main" appears TWICE below (push.branches and checkout.ref).
# Replace both with the repo's actual default branch (git symbolic-ref refs/remotes/origin/HEAD).
# On a master repo the un-substituted workflow never fires on push and the checkout pins the
# wrong ref -- and the failure is SILENT: no run, no error. (Hit on aac-task-management,
# 2026-07-28: default branch master.)
on:
  push:
    branches: [master]
  issues:
    types: [opened, closed, reopened, edited, labeled, unlabeled, assigned, unassigned]
  workflow_dispatch:

concurrency:
  group: dashboard
  cancel-in-progress: true

permissions:
  contents: write
  issues: read
  actions: read

jobs:
  refresh:
    # ubuntu, not windows-latest (issue 452). The old comment here read "CONFIG.testCommand is a
    # PowerShell script that restores a Windows profile ... Nothing about it runs on Linux", and
    # it was true of that suite: it still needs Windows. But the suite no longer runs here. The
    # dashboard's health line is the conclusion of the latest completed windows-restore-test.yml
    # run on master (CONFIG.testWorkflow, read through `gh run list`, hence `actions: read` above),
    # and that job is the Windows venue that proves the suite. Nothing left in this job needs
    # Windows: node, gh and git. Do not re-add a testCommand -- it re-bills the suite per event.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Build DASHBOARD.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-dashboard.js
      - name: Commit if changed
        run: |
          # `git add -N` (intent-to-add) FIRST. `git diff` is blind to an untracked file, so on a
          # repo where DASHBOARD.md does not exist yet -- i.e. every fresh install -- this step
          # printed "Dashboard unchanged" and exited 0. The workflow went green while never
          # creating the artifact it exists to create, and nothing about the run looked wrong.
          # Found on the commissions install, 2026-07-30 (run 30570115511). Do not remove.
          git add -N DASHBOARD.md
          if git diff --quiet -- DASHBOARD.md; then
            echo "Dashboard unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DASHBOARD.md
          git commit -m "chore: refresh dashboard [skip ci]"
          # Push the fresh commit to a dedicated `dashboard` branch, NOT to master. issue 20:
          # master must never advance from a dashboard refresh -- every advance flipped
          # already-drifted live copies into state3 (both-diverged hard block) even though
          # DASHBOARD.md is not in the sync manifest and has no bearing on live state. The
          # dashboard branch is force-pushed each run: it is a snapshot artifact rebased on
          # master's tip, not a rolling history. Stable read URL:
          #   https://github.com/<owner>/<repo>/blob/dashboard/DASHBOARD.md
          git push -f origin HEAD:refs/heads/dashboard
