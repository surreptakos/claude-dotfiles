name: skill tests

# Two jobs: session-check (below) and repo-tests, the tests/ + tools/ suites as a set (issue 672).
#
# The session-check skill ships its own regression suite next to the engine it covers
# (aac-skills/session-check/*.test.js). Nothing ran it when this workflow was written: the repo
# test command in .claude/session.json named tools/*.test.js and a single file out of tests/, and
# the restore test only asserts that each junctioned skill carries a SKILL.md. So check.test.js sat
# red on master until issue 300, and the five files beside it could have gone the same way unseen.
# That command now names aac-skills/session-check/*.test.js as well, and tests/*.test.js as a
# glob (issue 415) -- but it runs on Windows, from this checkout, so the second job below is still
# the only thing that sees the bug described next.
#
# TWO RUNS, on purpose. These tests are written to be run from wherever the skill is installed, and
# the bug issue 300 fixed was exactly a location assumption: "this repo" was `__dirname/../../..`,
# which is the repo root from the aac-skills mirror and the HOME DIRECTORY from the installed
# copy at ~/.claude/skills/session-check that SKILL.md tells you to run them from. A run from the
# checkout alone is green on that bug. The second run — the same files, copied out of the checkout,
# with only their sibling skill for company — is the one that sees it.
#
# Linux only: nothing in these files is Windows-specific (they spawn process.execPath and write
# under os.tmpdir()). The repo's Windows coverage is the restore test.

on:
  pull_request:
  push:
    branches-ignore: [dashboard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: From the checkout (aac-skills mirror)
        run: node --test aac-skills/session-check/*.test.js
      - name: From a copy outside any checkout (where the skill is actually installed)
        run: |
          dest="$RUNNER_TEMP/installed-skills"
          rm -rf "$dest"
          mkdir -p "$dest"
          # project-harness travels too: the harness tests discover it as a sibling, which is how
          # it sits in ~/.claude/skills and in the plugin payload.
          cp -r aac-skills/session-check aac-skills/project-harness "$dest/"
          cd "$dest/session-check"
          node --test *.test.js

  # The repo's own suites, as a set (issue 672). Several tools/*.test.js files run inside the job
  # that owns their tool (board-sweep, tracker-audit, ...), but most had no job at all: a red
  # assertion in one of them sat on master until someone ran the session test command by hand.
  # This is that command's Node half, on every pull request and every push, master included.
  repo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: tests/*.test.js and tools/*.test.js
        run: node --test tests/*.test.js tools/*.test.js
      # A gate never seen to fail is not known to work: plant one broken assertion and require the
      # same command to go red, then put the file back.
      - name: Fault - a broken assertion in a tools test must fail the set
        run: |
          f=tools/harness-bootstrap-delivery.test.js
          printf "\ntest('fault: planted by skill-tests.yml', () => { assert.equal(1, 2); });\n" >> "$f"
          if node --test tests/*.test.js tools/*.test.js > "$RUNNER_TEMP/fault.log" 2>&1; then
            echo "::error::the set passed with a broken assertion in $f"; exit 1
          fi
          grep -q "^not ok .* - fault: planted by skill-tests.yml" "$RUNNER_TEMP/fault.log"
          git checkout -- "$f"
